name: Avalonia desktop build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Reject tracked private runtime data
        shell: pwsh
        run: ./.github/scripts/assert-no-sensitive-files.ps1 -TrackedFiles
      - name: Test Core
        run: dotnet test open-source/SDAPlusPlus.Core.Tests/SDAPlusPlus.Core.Tests.csproj -c Release
      - name: Render documentation views with isolated demo services
        run: dotnet run --project tools/SDAPlusPlus.Screenshots -c Release -- artifacts/screenshots
      - name: Publish Avalonia Windows x64
        run: dotnet publish open-source/SDAPlusPlus.Desktop/SDAPlusPlus.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/avalonia -p:DebugType=None -p:DebugSymbols=false
      - name: Package and verify
        shell: pwsh
        run: |
          [xml]$project = Get-Content open-source/SDAPlusPlus.Desktop/SDAPlusPlus.Desktop.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag/version mismatch" }
          Copy-Item docs/releases/1.7.4.md artifacts/avalonia/RELEASE-NOTES.md
          ./.github/scripts/assert-no-sensitive-files.ps1 -ScanRoot artifacts/avalonia
          $archive = "artifacts/SDAplusplus-Avalonia-$version-win-x64.zip"
          Compress-Archive -Path artifacts/avalonia/* -DestinationPath $archive
          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          Set-Content -LiteralPath "$archive.sha256" -Encoding ascii -Value "$checksum  $(Split-Path -Leaf $archive)"
      - uses: actions/upload-artifact@v4
        with:
          name: SDAplusplus-Avalonia-windows-x64
          path: |
            artifacts/SDAplusplus-Avalonia-*-win-x64.zip
            artifacts/SDAplusplus-Avalonia-*-win-x64.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SDAplusplus-Avalonia-windows-x64
          path: artifacts
      - name: Publish Avalonia release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(Get-ChildItem artifacts -File | ForEach-Object FullName)
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @assets --title "SDA++ $tag — Avalonia Desktop" --notes-file docs/releases/1.7.4.md --latest
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          } else {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Asset upload failed" }
            gh release edit $tag --title "SDA++ $tag — Avalonia Desktop" --notes-file docs/releases/1.7.4.md --latest
            if ($LASTEXITCODE -ne 0) { throw "Release update failed" }
          }
